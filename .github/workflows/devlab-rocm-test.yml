# Run TRL's test suite on real consumer AMD GPUs.
#
# TRL tests AMD on MI300 (tests_amd in tests.yml). This adds a Radeon 8060S
# (Strix Halo, gfx1151) and a Radeon AI PRO R9700 (gfx1201): the same install
# as tests_amd, torch for ROCm from download.pytorch.org, and a deterministic
# sample of tests/ (tests/distributed needs two GPUs and is left out).
#
# Every run uploads summary-*.json (versions, device, pass/fail counts) so
# results compare across torch/ROCm versions; other workflows call this one
# for a version matrix (workflow_call).
#
# Runners: AMD DevLab, a donated pool of ephemeral, single-use machines. One
# job per machine; nothing persists between jobs.
name: ROCm test (gfx1151, gfx1201)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      no_hip_caching:
        description: Run the tests with PYTORCH_NO_HIP_MEMORY_CACHING=1 (allocator experiment)
        type: boolean
        default: false
      torch_index_url:
        description: Index torch comes from
        default: https://download.pytorch.org/whl/rocm7.2
      tests_per_file:
        description: Test cases to run per test file
        default: "40"
      torch_spec:
        description: torch packages ({gfx} becomes the job's chip)
        default: "torch torchvision"
      label:
        description: Name for this combination (summary and concurrency)
        default: release
  workflow_call:
    inputs:
      torch_spec: {type: string, default: "torch torchvision"}
      torch_index_url: {type: string, default: https://download.pytorch.org/whl/rocm7.2}
      tests_per_file: {type: string, default: "40"}
      label: {type: string, default: release}

permissions:
  contents: read

concurrency:
  group: rocm-test-${{ github.ref }}-${{ inputs.label || 'release' }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.gpu }} (${{ matrix.gfx }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # workers: PYTEST_XDIST_AUTO_NUM_WORKERS for `-n auto` (upstream's MI300 job uses 19). Each worker
          # imports torch + transformers and loads tiny models: about 2.5-3.5 GB resident at peak. The R9700 VMs
          # have 32 GB of RAM: 6 workers leave ~10 GB for the OS, pip caches and the runner. Strix Halo has 128 GB
          # shared between CPU and GPU: 8. The "Tests" step logs peak memory so these can be revisited.
          - gpu: strix-halo
            gfx: gfx1151
            workers: 8
          - gpu: radeon-r9700
            gfx: gfx1201
            workers: 6
    runs-on: [self-hosted, Linux, devlab-dispatch, "${{ matrix.gpu }}"]
    timeout-minutes: 90
    env:
      TORCH_SPEC: ${{ inputs.torch_spec || 'torch torchvision' }}
      TORCH_INDEX_URL: ${{ inputs.torch_index_url || 'https://download.pytorch.org/whl/rocm7.2' }}
      PER_FILE: ${{ inputs.tests_per_file || '40' }}
      LABEL: ${{ inputs.label || 'release' }}
      TORCH_INDEX_MAP: ${{ vars.TORCH_INDEX_MAP }}
      OMP_NUM_THREADS: "1"
      SAMPLER_DIR: ${{ github.workspace }}/../devlab-sampler
    steps:
      - uses: actions/checkout@v4

      - name: Write the test sampler
        run: |
          # A pytest plugin that keeps a deterministic sample at collection time:
          # every pytest-xdist worker selects the same tests, and node ids never
          # pass through the shell.
          mkdir -p "$SAMPLER_DIR"
          cat > "$SAMPLER_DIR/devlab_sample.py" <<'PY'
          import os
          import sys
          from collections import defaultdict

          import pytest


          def pytest_collection_modifyitems(config, items):
              per = int(os.environ.get("DEVLAB_PER") or 0)
              if per <= 0:
                  return
              by_file = os.environ.get("DEVLAB_GROUP", "function") == "file"
              groups = defaultdict(list)
              for item in items:
                  nodeid = item.nodeid
                  groups[nodeid.split("::")[0] if by_file else nodeid.split("[")[0]].append(item)
              keep = set()
              for members in groups.values():
                  step = max(1, len(members) // per)
                  keep.update(id(i) for i in members[::step][:per])
              config.hook.pytest_deselected(items=[i for i in items if id(i) not in keep])
              items[:] = [i for i in items if id(i) in keep]


          @pytest.hookimpl(wrapper=True, trylast=True)
          def pytest_runtest_protocol(item, nextitem):
              # A GPU fault (e.g. an illegal memory access) poisons the process's
              # HIP context, and every later test on that xdist worker fails with
              # it. Exit the worker instead; xdist reports the test and restarts it.
              result = yield
              torch = sys.modules.get("torch")
              if os.environ.get("PYTEST_XDIST_WORKER") and torch is not None and torch.cuda.is_initialized():
                  try:
                      torch.cuda.synchronize()
                  except Exception as exc:
                      sys.stderr.write(f"devlab: GPU context lost after {item.nodeid}: {exc}\n")
                      sys.stderr.flush()
                      os._exit(3)
              return result
          PY

      - name: Install torch and TRL
        run: |
          set -euo pipefail
          python3 -m venv venv
          . venv/bin/activate
          pip install -q --upgrade pip
          spec="${TORCH_SPEC//\{gfx\}/${{ matrix.gfx }}}"     # torch[device-{gfx}] for TheRock
          INDEX="$TORCH_INDEX_URL"
          # A runner pool with a package mirror maps public indexes to it with the
          # TORCH_INDEX_MAP repository variable (JSON: index URL -> mirror URL).
          # Unset, the index is used as given.
          EXTRA=()
          if [ -n "${TORCH_INDEX_MAP:-}" ]; then
            idx_in="$INDEX"
            # A value is a mirror URL, or a list [index, extra index, ...] when the
            # mirror serves the index's packages from more than one repository.
            idx=$(python3 -c 'import json,sys; m=json.loads(sys.argv[1]); u=sys.argv[2]; v=m.get(u.rstrip("/")+"/", m.get(u.rstrip("/"), u)); print("\n".join([v] if isinstance(v, str) else v))' "$TORCH_INDEX_MAP" "$INDEX")
            mapfile -t idx <<<"$idx"
            INDEX="${idx[0]}"
            for e in "${idx[@]:1}"; do EXTRA+=(--extra-index-url "$e"); done
            [ "$INDEX" = "$idx_in" ] && [ ${#idx[@]} -eq 1 ] || echo "torch index mapped: $idx_in -> $INDEX${EXTRA:+ (extra: ${idx[*]:1})}"
          fi
          echo "torch: $spec from $INDEX"
          # PIP_CONFIG_FILE=/dev/null: a runner's pip.conf may add PyPI as an extra
          # index, and PyPI's newer CUDA torch would then win over the ROCm one.
          PIP_CONFIG_FILE=/dev/null pip install -q $spec --index-url "$INDEX" "${EXTRA[@]}"
          # Pin the torch stack for every later pip call: a package that depends on
          # torch can otherwise replace the ROCm build with a CUDA wheel from PyPI,
          # and the tests run on the CPU.
          pip freeze | grep -iE '^(torch|torchvision|torchaudio|triton|pytorch-triton-rocm|rocm[a-z0-9_-]*)==' \
            > "$RUNNER_TEMP/torch-pin.txt"
          cat "$RUNNER_TEMP/torch-pin.txt"
          export PIP_CONSTRAINT="$RUNNER_TEMP/torch-pin.txt"
          echo "PIP_CONSTRAINT=$PIP_CONSTRAINT" >> "$GITHUB_ENV"
          pip install -q ".[dev]" pytest-timeout
          # A host-wide Hugging Face cache this job cannot write (left by another
          # user) fails every download; fall back to a job-local cache.
          hub=$(python -c 'from huggingface_hub import constants as c; print(c.HF_HUB_CACHE)')
          if [ -e "$hub" ] && [ -n "$(find "$hub" -maxdepth 2 ! -writable -print -quit 2>/dev/null)" ]; then
            echo "::warning::Hugging Face cache $hub is not writable; using a job-local cache"
            echo "HF_HOME=$RUNNER_TEMP/hf" >> "$GITHUB_ENV"
            echo "HF_HUB_CACHE=$RUNNER_TEMP/hf/hub" >> "$GITHUB_ENV"
          fi
          python - <<'PY'
          import json, torch, trl, transformers
          assert torch.version.hip, "not a ROCm build of torch"
          torch.cuda.init()
          p = torch.cuda.get_device_properties(0)
          info = {"torch": torch.__version__, "hip": torch.version.hip, "device": p.name,
                  "arch": p.gcnArchName, "trl": trl.__version__,
                  "transformers": transformers.__version__}
          print(info)
          json.dump(info, open("env.json", "w"))
          assert "${{ matrix.gfx }}" in p.gcnArchName, f"expected ${{ matrix.gfx }}, got {p.gcnArchName}"
          PY

      - name: Tests (deterministic sample)
        run: |
          set -euo pipefail
          . venv/bin/activate
          # Upstream's command (Makefile `test`, tests.yml tests_amd): -n auto --dist loadgroup -s -v, reruns for
          # transient Hub/OOM errors. Ours adds the deterministic sample, tests/distributed left out (2 GPUs),
          # junit for the judge, a per-test timeout and worker restarts after a GPU fault.
          # Test failures do not fail this step; "Judge results" decides, so a
          # known upstream failure can show as a warning instead.
          export PYTEST_XDIST_AUTO_NUM_WORKERS="${{ matrix.workers }}"
          # PYTORCH_NO_HIP_MEMORY_CACHING counts as set even when empty, so export it only when asked.
          if [ "${{ inputs.no_hip_caching }}" = true ]; then export PYTORCH_NO_HIP_MEMORY_CACHING=1; echo "PYTORCH_NO_HIP_MEMORY_CACHING=1"; fi
          # Peak memory, to size PYTEST_XDIST_AUTO_NUM_WORKERS.
          ( peak=0; while sleep 5; do u=$(free -m | awk '/^Mem:/{print $3}'); [ "$u" -gt "$peak" ] && peak=$u && echo "$peak" > mem-peak.txt; done ) &
          mem_pid=$!
          # Watchdog: with `--dist loadgroup`, pytest-xdist 3.8 hangs for good once a worker crashes (a GPU
          # fault aborts one). SIGINT after 40 min ends the session and keeps the junit of what ran.
          rc=0
          PYTHONPATH="$SAMPLER_DIR" DEVLAB_PER="$PER_FILE" DEVLAB_GROUP=file \
            timeout -s INT -k 120 40m python -m pytest -n auto --dist loadgroup -s -v --reruns 5 --reruns-delay 1 \
            --only-rerun '(OSError|Timeout|HTTPError.*502|HTTPError.*504|out of memory|STATUS_ALLOC_FAILED)' \
            tests --ignore=tests/distributed -p devlab_sample -rf -p no:cacheprovider \
            --max-worker-restart=16 --timeout=900 --junitxml=junit.xml || rc=$?
          kill "$mem_pid" 2>/dev/null || true
          echo "peak memory used: $(cat mem-peak.txt 2>/dev/null) MiB of $(free -m | awk '/^Mem:/{print $2}') MiB, ${PYTEST_XDIST_AUTO_NUM_WORKERS} workers"
          echo "$rc" > pytest-rc.txt
          echo "pytest exit code: $rc"

      - name: Judge results
        if: always()
        run: |
          python3 - <<'PY'
          # Red only for a new failure or a broken setup. A failure matching
          # .github/devlab-known-failures.txt (classified upstream) is a warning.
          import fnmatch, json, os, sys, xml.etree.ElementTree as ET
          known = []
          if os.path.exists(".github/devlab-known-failures.txt"):
              for line in open(".github/devlab-known-failures.txt"):
                  line = line.strip()
                  if line and not line.startswith("#"):
                      pat, reason, issue = ([f.strip() for f in line.split("|")] + ["", ""])[:3]
                      known.append((pat, reason, issue))
          def nodeid(classname, name):
              parts = classname.split(".")
              for i in range(len(parts), 0, -1):
                  path = "/".join(parts[:i]) + ".py"
                  if os.path.exists(path):
                      return "::".join([path] + parts[i:] + [name])
              return "::".join(parts + [name])
          rc = open("pytest-rc.txt").read().strip() if os.path.exists("pytest-rc.txt") else None
          failed, broken = [], None
          if rc is None or not os.path.exists("junit.xml"):
              broken = "the tests did not run (install or setup failed)"
          elif rc not in ("0", "1"):
              broken = f"pytest exited with {rc} (interrupted, e.g. by the 40-min watchdog after a hang; internal error; or nothing collected)"
          else:
              for case in ET.parse("junit.xml").getroot().iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      i = nodeid(case.get("classname", ""), case.get("name", ""))
                      if i not in failed:
                          failed.append(i)
          known_ids, new_ids, lines = [], [], []
          for i in failed:
              hit = next((k for k in known if fnmatch.fnmatchcase(i, k[0])), None)
              if hit:
                  known_ids.append(i)
                  print(f"::warning title=Known upstream failure::{i} — {hit[1]} ({hit[2]})")
                  lines.append(f"- :warning: known upstream: `{i}` — {hit[1]} ({hit[2]})")
              else:
                  new_ids.append(i)
                  print(f"::error title=New failure::{i}")
                  lines.append(f"- :x: new failure: `{i}`")
          if broken:
              print(f"::error title=Tests did not run::{broken}")
              lines.insert(0, f"- :x: {broken}")
          verdict = "fail" if broken or new_ids else ("known-failures" if known_ids else "pass")
          json.dump({"verdict": verdict, "known_failures": known_ids, "new_failures": new_ids},
                    open("verdict.json", "w"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### ${{ matrix.gpu }} (${{ matrix.gfx }}): {verdict}\n" + "\n".join(lines) + "\n")
          print(f"verdict: {verdict} ({len(known_ids)} known, {len(new_ids)} new)")
          sys.exit(1 if verdict == "fail" else 0)
          PY

      - name: Write the run summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, datetime, xml.etree.ElementTree as ET
          def load(p):
              try:
                  return json.load(open(p))
              except Exception:
                  return None
          tests = None
          if os.path.exists("junit.xml"):
              s = ET.parse("junit.xml").getroot()
              s = s if s.tag == "testsuite" else s.find("testsuite")
              n = {k: int(s.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")}
              tests = {"ran": n["tests"], "failed": n["failures"], "errors": n["errors"],
                       "skipped": n["skipped"],
                       "passed": n["tests"] - n["failures"] - n["errors"] - n["skipped"],
                       "seconds": round(float(s.get("time", 0)), 1)}
          env = load("env.json") or {}
          judged = load("verdict.json") or {"verdict": "fail", "known_failures": [], "new_failures": []}
          summary = {
              "schema": 1, "project": "trl", "label": os.environ["LABEL"],
              "release": env.get("trl", ""), "combo": f"torch{env.get('torch', '?')}",
              "torch_spec": os.environ.get("TORCH_SPEC", ""), "gpu": "${{ matrix.gpu }}",
              "gfx": "${{ matrix.gfx }}", "env": env or None, "smoke": None, "tests": tests,
              "verdict": judged["verdict"], "known_failures": judged["known_failures"],
              "new_failures": judged["new_failures"],
              "job_status": "${{ job.status }}", "commit": "${{ github.sha }}",
              "run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "finished": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
          }
          json.dump(summary, open("summary.json", "w"), indent=1)
          print(json.dumps(summary, indent=1))
          PY

      - name: Upload the run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devlab-summary-${{ inputs.label || 'release' }}-${{ matrix.gpu }}-${{ github.run_attempt }}
          path: summary.json
          retention-days: 90
